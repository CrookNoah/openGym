# claude-launcher — Hyprland integration
#
# Sourced from ~/.config/hypr/bindings.conf by install.sh. Safe to edit.
#
# Keyboard navigation works through a submap: opening the widget enters
# `claude_launcher`, where the keys below are captured and everything else
# (letters, backspace) falls through to the search field. Every exit path
# resets the submap, so the keyboard can never get stuck.

# ── the summon key ───────────────────────────────────────────────────────────
bind = SUPER, A, exec, claude-launcher toggle

# ── frosted glass behind the widget ──────────────────────────────────────────
layerrule = blur, claude-launcher
layerrule = ignorealpha 0.2, claude-launcher

# ── keys active only while the launcher is up ────────────────────────────────
# Everything after this line belongs to the submap, until `submap = reset`.
submap = claude_launcher

bind =       , escape, exec, claude-launcher ctl close
bind = SUPER , A,      exec, claude-launcher ctl close

bind =       , up,     exec, claude-launcher ctl move up
bind =       , down,   exec, claude-launcher ctl move down
bind = CTRL  , k,      exec, claude-launcher ctl move up
bind = CTRL  , j,      exec, claude-launcher ctl move down
bind = CTRL  , p,      exec, claude-launcher ctl move up
bind = CTRL  , n,      exec, claude-launcher ctl move down

# Enter resumes the last session when there is one; Shift+Enter always starts
# a fresh conversation. Swap by setting resume_by_default = false in config.
bind =       , return, exec, claude-launcher ctl open
bind = SHIFT , return, exec, claude-launcher ctl open-fresh

bind = CTRL  , r,      exec, claude-launcher ctl refresh

submap = reset
