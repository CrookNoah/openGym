<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c1a14">
<title>Chip Yard</title>
<meta name="description" content="Feed the chipper. Fill the truck. Don't jam it. A wood-chipper arcade puzzle game.">
<style>
  html,body{margin:0;padding:0;height:100%;background:#0c1a14;overflow:hidden;}
  body{position:fixed;inset:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;}
  canvas{display:block;touch-action:none;image-rendering:auto;}
</style>
</head>
<body>
<canvas id="g" aria-label="Chip Yard game" role="img"></canvas>
<script>
(() => {
'use strict';

/* =========================================================================
   CHIP YARD  —  a wood-chipper arcade puzzler
   Single-file, zero-dependency HTML5 canvas game.
   Drop this file anywhere and embed it with an <iframe>.
   ========================================================================= */

// ---------- constants ----------
const COLS = 10, ROWS = 20, HIDDEN = 2, VIS = ROWS - HIDDEN;
const ROWS_PER_TRUCK = 10, MAX_BLADE = 3, MAX_FUEL = 3, FUEL_ROWS = 4;
const DAS = 0.16, ARR = 0.035, LOCK_DELAY = 0.5, MAX_LOCK_RESETS = 15, CLEAR_TIME = 0.34;
const TAU = Math.PI * 2;
const TITLE_FONT = "Impact, 'Arial Black', 'Helvetica Neue', Arial, sans-serif";
const BODY_FONT = "'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif";
const IS_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

const canvas = document.getElementById('g');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(320, window.innerWidth); H = Math.max(320, window.innerHeight);
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
}
window.addEventListener('resize', resize);
resize();

// ---------- utils ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;
function mulberry(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(a, b, t) {
  const A = hexToRgb(a), B = hexToRgb(b);
  return `rgb(${Math.round(lerp(A[0], B[0], t))},${Math.round(lerp(A[1], B[1], t))},${Math.round(lerp(A[2], B[2], t))})`;
}
function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function text(str, x, y, o = {}) {
  const size = o.size || 16, font = o.font || BODY_FONT, weight = o.weight || '700';
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.baseline || 'alphabetic';
  if (o.spacing) { try { ctx.letterSpacing = o.spacing + 'px'; } catch (e) { } }
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.strokeW || Math.max(2, size * 0.14); ctx.strokeStyle = o.stroke; ctx.strokeText(str, x, y); }
  ctx.fillStyle = o.color || '#fff';
  ctx.fillText(str, x, y);
  if (o.spacing) { try { ctx.letterSpacing = '0px'; } catch (e) { } }
}

// ---------- audio (all synthesized, no files) ----------
const Sound = (() => {
  let ac = null, master = null, noiseBuf = null, hum = null, muted = false;
  try { muted = localStorage.getItem('chipyard.muted') === '1'; } catch (e) { }
  function init() {
    if (ac) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try { ac = new AC(); } catch (e) { return; }
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.6; master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function resume() { if (ac && ac.state === 'suspended') ac.resume().catch(() => { }); }
  const now = () => ac ? ac.currentTime : 0;
  function tone(freq, dur, o = {}) {
    if (!ac) return;
    const t = now() + (o.delay || 0), osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(freq, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.slide), t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(o.vol || 0.3, t + (o.attack || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(master); osc.start(t); osc.stop(t + dur + 0.05);
  }
  function noise(dur, o = {}) {
    if (!ac) return;
    const t = now() + (o.delay || 0), s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = ac.createBiquadFilter(); f.type = o.type || 'bandpass'; f.frequency.setValueAtTime(o.freq || 1000, t);
    if (o.slide) f.frequency.exponentialRampToValueAtTime(o.slide, t + dur); f.Q.value = o.q || 1;
    const g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(o.vol || 0.3, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.05);
  }
  function startHum() {
    if (!ac || hum) return;
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 180;
    const g = ac.createGain(); g.gain.value = 0; s.connect(f); f.connect(g); g.connect(master); s.start();
    const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 48;
    const lf = ac.createBiquadFilter(); lf.type = 'lowpass'; lf.frequency.value = 160;
    const og = ac.createGain(); og.gain.value = 0; o.connect(lf); lf.connect(og); og.connect(master); o.start();
    hum = { s, f, g, o, lf, og };
    g.gain.linearRampToValueAtTime(0.10, now() + 1); og.gain.linearRampToValueAtTime(0.05, now() + 1);
  }
  function setHum(level, strain) {
    if (!hum) return; const t = now();
    hum.o.frequency.setTargetAtTime(48 + level * 3 + strain * 24, t, 0.2);
    hum.f.frequency.setTargetAtTime(180 + level * 20 + strain * 400, t, 0.2);
    hum.g.gain.setTargetAtTime(0.10 + strain * 0.1, t, 0.2);
  }
  function stopHum() {
    if (!hum) return; const t = now(), h = hum; hum = null;
    h.g.gain.setTargetAtTime(0, t, 0.3); h.og.gain.setTargetAtTime(0, t, 0.3);
    setTimeout(() => { try { h.s.stop(); h.o.stop(); } catch (e) { } }, 1500);
  }
  function toggleMute() {
    muted = !muted; if (master) master.gain.setTargetAtTime(muted ? 0 : 0.6, now(), 0.02);
    try { localStorage.setItem('chipyard.muted', muted ? '1' : '0'); } catch (e) { }
    return muted;
  }
  const sfx = {
    move() { tone(520, 0.03, { type: 'square', vol: 0.04 }); },
    rotate() { tone(700, 0.05, { type: 'triangle', vol: 0.12, slide: 900 }); },
    hold() { tone(400, 0.08, { type: 'triangle', vol: 0.12, slide: 600 }); },
    lock() { tone(110, 0.12, { type: 'sine', vol: 0.35, slide: 50 }); noise(0.08, { vol: 0.15, freq: 600, q: 0.7 }); },
    drop() { tone(160, 0.15, { type: 'sine', vol: 0.4, slide: 40 }); noise(0.12, { vol: 0.25, freq: 400, q: 0.7 }); },
    clear(n) {
      noise(0.35 + n * 0.12, { vol: 0.35, freq: 1800, q: 0.5, slide: 300 });
      tone(80, 0.4, { type: 'sawtooth', vol: 0.25, slide: 40 });
      for (let i = 0; i < n; i++) tone(300 + i * 120, 0.15, { type: 'square', vol: 0.08, delay: i * 0.07, slide: 600 + i * 120 });
      if (n >= 4) { tone(220, 0.5, { type: 'sawtooth', vol: 0.2, slide: 440, delay: 0.1 }); noise(0.6, { vol: 0.3, freq: 3000, q: 0.4, slide: 500, delay: 0.1 }); }
    },
    saw() { tone(95, 0.45, { type: 'sawtooth', vol: 0.28, slide: 160 }); tone(190, 0.45, { type: 'square', vol: 0.1, slide: 320 }); noise(0.45, { vol: 0.2, freq: 2500, q: 0.8, slide: 4000 }); },
    rock() { tone(2600, 0.25, { type: 'square', vol: 0.2, slide: 1800 }); tone(3900, 0.2, { type: 'square', vol: 0.12, slide: 2900 }); noise(0.3, { vol: 0.4, freq: 5000, q: 0.3 }); tone(60, 0.3, { type: 'sine', vol: 0.4, slide: 30 }); },
    toss() { tone(500, 0.25, { type: 'triangle', vol: 0.15, slide: 1200 }); noise(0.2, { vol: 0.1, freq: 2000, q: 1, delay: 0.15 }); },
    levelup() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, { type: 'square', vol: 0.12, delay: i * 0.09 })); tone(200, 0.6, { type: 'sawtooth', vol: 0.15, slide: 120, delay: 0.3 }); },
    honk() { tone(330, 0.18, { type: 'sawtooth', vol: 0.12 }); tone(415, 0.18, { type: 'sawtooth', vol: 0.12 }); tone(330, 0.25, { type: 'sawtooth', vol: 0.12, delay: 0.22 }); tone(415, 0.25, { type: 'sawtooth', vol: 0.12, delay: 0.22 }); },
    start() { [392, 523, 659].forEach((f, i) => tone(f, 0.2, { type: 'triangle', vol: 0.15, delay: i * 0.08 })); },
    gameover() { [400, 320, 240, 150].forEach((f, i) => tone(f, 0.35, { type: 'sawtooth', vol: 0.15, delay: i * 0.18, slide: f * 0.8 })); noise(1.2, { vol: 0.25, freq: 400, q: 0.5, slide: 60 }); },
    pause() { tone(300, 0.1, { type: 'square', vol: 0.08 }); },
    warn() { tone(880, 0.08, { type: 'square', vol: 0.07 }); tone(660, 0.08, { type: 'square', vol: 0.07, delay: 0.1 }); },
    fuel() { tone(660, 0.1, { type: 'triangle', vol: 0.1, slide: 990 }); },
  };
  return { init, resume, startHum, setHum, stopHum, toggleMute, get muted() { return muted; }, sfx };
})();

// ---------- pieces ----------
const SHAPES = {
  I: { c: [[0, 0], [1, 0], [2, 0], [3, 0]], t: 'log' },
  O: { c: [[0, 0], [1, 0], [0, 1], [1, 1]], t: 'stump' },
  T: { c: [[0, 0], [1, 0], [2, 0], [1, 1]], t: 'branch' },
  L: { c: [[0, 0], [1, 0], [2, 0], [0, 1]], t: 'branch' },
  J: { c: [[0, 0], [1, 0], [2, 0], [2, 1]], t: 'branch' },
  S: { c: [[1, 0], [2, 0], [0, 1], [1, 1]], t: 'brush' },
  Z: { c: [[0, 0], [1, 0], [1, 1], [2, 1]], t: 'brush' },
  B: { c: [[0, 0], [1, 0], [2, 0], [3, 0], [0, 1], [1, 1], [2, 1], [3, 1]], t: 'biglog' },
};
const KICKS = [[0, 0], [-1, 0], [1, 0], [0, -1], [-2, 0], [2, 0], [-1, -1], [1, -1], [0, -2], [0, 1], [0, 2]];
let pieceSeq = 1;

function bbox(cells) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const c of cells) { if (c.x < x0) x0 = c.x; if (c.y < y0) y0 = c.y; if (c.x > x1) x1 = c.x; if (c.y > y1) y1 = c.y; }
  return { x0, y0, x1, y1, w: x1 - x0 + 1, h: y1 - y0 + 1 };
}
function normalize(p) {
  const b = bbox(p.cells);
  for (const c of p.cells) { c.x -= b.x0; c.y -= b.y0; }
  p.x += b.x0; p.y += b.y0; p.w = b.w; p.h = b.h; p.ax = b.w >= b.h ? 'h' : 'v';
  return p;
}
function makePiece(kind, level) {
  const sh = SHAPES[kind], id = pieceSeq++;
  const cells = sh.c.map(([x, y], i) => ({ x, y, t: sh.t, seed: (id * 131 + i * 17) & 0xffff }));
  if (level >= 3 && (kind === 'S' || kind === 'Z' || kind === 'T') && Math.random() < 0.3) {
    // put the rock on a "leaf" cell so it can always be sawn off
    const key = c => c.x + ',' + c.y, set = new Set(cells.map(key));
    const leaves = cells.filter(c => [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(([dx, dy]) => set.has((c.x + dx) + ',' + (c.y + dy))).length === 1);
    (leaves[rint(0, leaves.length - 1)] || cells[0]).t = 'rock';
  }
  return normalize({ kind, id, cells, x: 0, y: 0 });
}
function rotatedCells(p, dir) {
  const b = bbox(p.cells), cx = (b.w - 1) / 2, cy = (b.h - 1) / 2;
  const cells = p.cells.map(c => {
    const dx = c.x - cx, dy = c.y - cy;
    return Object.assign({}, c, { x: dir > 0 ? cx - dy : cx + dy, y: dir > 0 ? cy + dx : cy - dx });
  });
  const nb = bbox(cells);
  for (const c of cells) { c.x = Math.round(c.x - nb.x0); c.y = Math.round(c.y - nb.y0); }
  return { cells, ox: Math.trunc((b.w - b.h) / 2), oy: Math.trunc((b.h - b.w) / 2) };
}
function components(cells) {
  const key = c => c.x + ',' + c.y, left = new Map(cells.map(c => [key(c), c])), out = [];
  while (left.size) {
    const [k0, c0] = left.entries().next().value; left.delete(k0);
    const comp = [c0], stack = [c0];
    while (stack.length) {
      const c = stack.pop();
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const k = (c.x + dx) + ',' + (c.y + dy);
        if (left.has(k)) { const n = left.get(k); left.delete(k); comp.push(n); stack.push(n); }
      }
    }
    out.push(comp);
  }
  return out;
}
function neighborsInSet(cells) {
  const set = new Set(cells.map(c => c.x + ',' + c.y));
  return c => ({ L: set.has((c.x - 1) + ',' + c.y), R: set.has((c.x + 1) + ',' + c.y), U: set.has(c.x + ',' + (c.y - 1)), D: set.has(c.x + ',' + (c.y + 1)) });
}

// ---------- game state ----------
let board = [];
const keys = { left: false, right: false, down: false };
let lastDir = null, dasT = 0, arrT = 0;
const G = {
  state: 'title', cur: null, hold: null, canHold: true, queue: [], bag: [],
  score: 0, level: 1, rows: 0, blade: MAX_BLADE, fuel: MAX_FUEL, fuelProg: 0, combo: -1, b2b: false,
  gravT: 0, lockT: 0, lockResets: 0, clearing: null, spawnDelay: 0,
  hi: 0, shake: 0, shakeX: 0, shakeY: 0, flash: 0, flashColor: '#fff',
  popups: [], parts: [], chuteQueue: 0,
  truck: { fill: 0, state: 'in', t: 0, off: 0 },
  drum: 0, drumSpd: 1, time: 0, overT: 0, toss: null, over: '', newHi: false,
  stats: { pieces: 0, fullFeeds: 0, tossed: 0, cuts: 0, trucks: 0 }, strain: 0, motes: [],
};
try { G.hi = parseInt(localStorage.getItem('chipyard.hi') || '0', 10) || 0; } catch (e) { }
for (let i = 0; i < 40; i++) G.motes.push({ x: Math.random(), y: Math.random(), s: rnd(0.4, 1.4), p: rnd(0, TAU), v: rnd(0.004, 0.012) });

function newBoard() { board = []; for (let y = 0; y < ROWS; y++) board.push(new Array(COLS).fill(null)); }
function fits(cells, px, py) {
  for (const c of cells) {
    const x = px + c.x, y = py + c.y;
    if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return false;
    if (board[y][x]) return false;
  }
  return true;
}
function gravity() { const l = Math.min(G.level, 20); return Math.pow(0.8 - (l - 1) * 0.007, l - 1); }
function refillQueue() {
  while (G.queue.length < 6) {
    if (!G.bag.length) {
      G.bag = ['I', 'O', 'T', 'L', 'J', 'S', 'Z'];
      for (let i = G.bag.length - 1; i > 0; i--) { const j = rint(0, i);[G.bag[i], G.bag[j]] = [G.bag[j], G.bag[i]]; }
      if (G.level >= 2) G.bag.splice(rint(1, G.bag.length - 1), 0, 'B');
    }
    G.queue.push(makePiece(G.bag.shift(), G.level));
  }
}
function spawn(p) {
  p.x = Math.floor((COLS - p.w) / 2); p.y = Math.max(0, HIDDEN - p.h + 1);
  G.cur = p; G.gravT = 0; G.lockT = 0; G.lockResets = 0;
  if (!fits(p.cells, p.x, p.y)) { // try nudging up once
    if (p.y > 0 && fits(p.cells, p.x, p.y - 1)) p.y--; else { gameOver('JAMMED'); }
  }
}
function spawnNext() { refillQueue(); spawn(G.queue.shift()); }

function resetGame() {
  newBoard(); G.cur = null; G.hold = null; G.canHold = true; G.queue = []; G.bag = [];
  G.score = 0; G.level = 1; G.rows = 0; G.blade = MAX_BLADE; G.fuel = MAX_FUEL; G.fuelProg = 0; G.combo = -1; G.b2b = false;
  G.gravT = 0; G.lockT = 0; G.lockResets = 0; G.clearing = null; G.spawnDelay = 0; G.toss = null; G.over = ''; G.newHi = false;
  G.popups = []; G.parts = []; G.chuteQueue = 0; G.truck = { fill: 0, state: 'in', t: 0, off: 0 };
  G.stats = { pieces: 0, fullFeeds: 0, tossed: 0, cuts: 0, trucks: 0 }; G.strain = 0;
  keys.left = keys.right = keys.down = false; dasT = arrT = 0;
}
function startGame() {
  resetGame(); G.state = 'playing';
  Sound.init(); Sound.resume(); Sound.startHum(); Sound.sfx.start();
  spawnNext();
  addPopup('FEED THE CHIPPER', { color: '#ffd166', size: 1.1, life: 1.4 });
}
function gameOver(reason) {
  G.state = 'over'; G.over = reason; G.overT = 0; G.cur = null;
  Sound.stopHum(); Sound.sfx.gameover(); G.shake = Math.max(G.shake, 12);
  G.flash = 1; G.flashColor = reason === 'JAMMED' ? '#ffb36b' : '#ff4a3d';
  if (G.score > G.hi) { G.hi = G.score; G.newHi = true; try { localStorage.setItem('chipyard.hi', String(G.hi)); } catch (e) { } }
}
function togglePause() {
  if (G.state === 'playing') { G.state = 'paused'; Sound.sfx.pause(); Sound.setHum(G.level, 0); }
  else if (G.state === 'paused') { G.state = 'playing'; Sound.resume(); Sound.sfx.pause(); }
}

// ---------- actions ----------
function grounded() { return G.cur && !fits(G.cur.cells, G.cur.x, G.cur.y + 1); }
function lockReset() { if (grounded()) { G.lockT = 0; G.lockResets++; } }
function tryMove(dx, dy, quiet) {
  const p = G.cur; if (!p) return false;
  if (!fits(p.cells, p.x + dx, p.y + dy)) return false;
  p.x += dx; p.y += dy; if (dx) lockReset();
  if (!quiet && dx) Sound.sfx.move();
  return true;
}
function tryRotate(dir) {
  const p = G.cur; if (!p) return;
  const r = rotatedCells(p, dir);
  for (const [kx, ky] of KICKS) {
    const nx = p.x + r.ox + kx, ny = p.y + r.oy + ky;
    if (fits(r.cells, nx, ny)) {
      p.cells = r.cells; p.x = nx; p.y = ny; normalize(p); lockReset(); Sound.sfx.rotate(); return;
    }
  }
}
function hardDrop() {
  const p = G.cur; if (!p) return;
  if (p.cells.every(c => c.t === 'rock')) { // toss the rock over the wall
    const n = p.cells.length;
    G.toss = { cells: p.cells.map(c => Object.assign({}, c)), x: p.x, y: p.y, t: 0 };
    G.cur = null; G.canHold = true; G.score += 150 * n; G.stats.tossed += n;
    addPopup('TOSSED! +' + 150 * n, { color: '#9be7ff', size: 0.9 }); Sound.sfx.toss();
    G.spawnDelay = 0.05; return;
  }
  let n = 0; while (fits(p.cells, p.x, p.y + 1)) { p.y++; n++; }
  G.score += 2 * n; G.shake = Math.max(G.shake, 4); Sound.sfx.drop();
  for (const c of p.cells) puff(L.wellX + (p.x + c.x + 0.5) * L.cell, L.wellY + (p.y + c.y - HIDDEN + 1) * L.cell, 3, '#c9b28a');
  lockPiece();
}
function holdPiece() {
  if (!G.cur || !G.canHold) return;
  const p = G.cur, h = G.hold;
  G.hold = normalize({ kind: p.kind, id: p.id, cells: p.cells.map(c => Object.assign({}, c)), x: 0, y: 0 });
  G.hold.x = 0; G.hold.y = 0; G.canHold = false; Sound.sfx.hold();
  if (h) spawn(h); else { G.cur = null; spawnNext(); }
}
function sawCut() {
  const p = G.cur; if (!p) return;

// ---------- drawing: scene ----------
function drawBackground() {
  const night = clamp((G.level - 1) / 9, 0, 1);
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, mix('#132436', '#050a12', night));
  sky.addColorStop(0.45, mix('#2a4a55', '#0b1826', night));
  sky.addColorStop(0.7, mix('#7a5a35', '#1a2a26', night));
  sky.addColorStop(0.78, mix('#3f5a3a', '#0d1a14', night));
  sky.addColorStop(1, '#07110c');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  // stars
  if (night > 0.05) {
    const r = mulberry(99); ctx.fillStyle = `rgba(255,255,255,${0.7 * night})`;
    for (let i = 0; i < 90; i++) { const x = r() * W, y = r() * H * 0.6, tw = 0.5 + 0.5 * Math.sin(G.time * (1 + r() * 2) + i); ctx.globalAlpha = tw * night; ctx.fillRect(x, y, 1.5, 1.5); }
    ctx.globalAlpha = 1;
  }
  // sun / moon
  const sx = W * 0.78, sy = H * (0.66 + night * 0.1), sr = Math.min(W, H) * 0.09;
  const glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr * 3.2);
  glow.addColorStop(0, mix('rgba(255,170,80,0.55)'.length ? '#ffb457' : '#ffb457', '#c9d6ff', night)); glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = 0.35; ctx.fillStyle = glow; ctx.fillRect(sx - sr * 3.2, sy - sr * 3.2, sr * 6.4, sr * 6.4); ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(sx, sy, sr * lerp(1, 0.6, night), 0, TAU); ctx.fillStyle = mix('#ffc06a', '#e8eeff', night); ctx.fill();
  // tree lines
  drawTreeLine(H * 0.74, 0.16, mix('#22423a', '#0e1f1a', night), 46, 5);
  drawTreeLine(H * 0.80, 0.24, mix('#132a22', '#081510', night), 34, 9);
  // ground
  ctx.fillStyle = mix('#0e1c14', '#060d09', night); ctx.fillRect(0, H * 0.80, W, H);
  // ground stripes / wood-chip lot texture
  const r2 = mulberry(7); ctx.fillStyle = 'rgba(180,140,90,0.06)';
  for (let i = 0; i < 60; i++) { ctx.fillRect(r2() * W, H * 0.8 + r2() * H * 0.2, 6 + r2() * 30, 2); }
  // motes
  for (const m of G.motes) { ctx.globalAlpha = 0.25 + 0.2 * Math.sin(m.p * 2); ctx.fillStyle = '#ffe9b0'; ctx.beginPath(); ctx.arc(m.x * W, m.y * H, m.s, 0, TAU); ctx.fill(); }
  ctx.globalAlpha = 1;
}

  const r = mulberry(seed); ctx.fillStyle = color;
  const n = Math.ceil(W / step) + 2;

    const x = i * step + (r() - 0.5) * step, h = H * hScale * (0.5 + r() * 0.7), w = step * (0.9 + r() * 0.8);

  ctx.fillStyle = '#f2c531'; ctx.fillRect(x, y, w, h);

  const { wellX, wellY, wellW, wellH, wall, cell, chipH } = L;

  ctx.strokeStyle = 'rgba(255,255,255,0.045)'; ctx.lineWidth = 1;
  for (let x = 1; x < COLS; x++) { ctx.beginPath(); ctx.moveTo(wellX + x * cell + 0.5, wellY); ctx.lineTo(wellX + x * cell + 0.5, wellY + wellH); ctx.stroke(); }
  for (let y = 1; y < VIS; y++) { ctx.beginPath(); ctx.moveTo(wellX, wellY + y * cell + 0.5); ctx.lineTo(wellX + wellW, wellY + y * cell + 0.5); ctx.stroke(); }

  // chipper body below
  const bx = wellX - wall, by = wellY + wellH, bw = wellW + wall * 2, bh = chipH;

    ctx.fillStyle = b.down ? 'rgba(255,255,255,0.32)' : 'rgba(0,0,0,0.45)'; roundRect(b.x, b.y, b.w, b.h, 12); ctx.fill();
    ctx.strokeStyle = b.down ? '#fff' : 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1.5; roundRect(b.x + 0.75, b.y + 0.75, b.w - 1.5, b.h - 1.5, 12); ctx.stroke();
    const isWord = b.label.length > 1;
    text(b.label, b.x + b.w / 2, b.y + b.h / 2 + (isWord ? 6 : 10), { size: isWord ? Math.min(20, b.h * 0.36) : Math.min(30, b.h * 0.5), font: isWord ? TITLE_FONT : BODY_FONT, weight: isWord ? '400' : '700', color: accent, align: 'center', spacing: isWord ? 1 : 0 });
  }
}
function drawOverlayPanel(w, h) {
  const x = W / 2 - w / 2, y = H / 2 - h / 2;
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(10,18,14,0.92)'; roundRect(x, y, w, h, 16); ctx.fill();
  ctx.strokeStyle = '#e0702a'; ctx.lineWidth = 3; roundRect(x + 1.5, y + 1.5, w - 3, h - 3, 16); ctx.stroke();
  hazardStripes(x + 16, y + 10, w - 32, 6);
  hazardStripes(x + 16, y + h - 16, w - 32, 6);
  return { x, y, w, h };
}
function drawTitle() {
  const w = Math.min(W - 24, 560), narrow = w < 420, h = Math.min(H - 24, narrow ? 450 : 420);
  const p = drawOverlayPanel(w, h), cx = W / 2;
  let y = p.y + 40;
  const bob = Math.sin(G.time * 2) * 3;
  text('CHIP YARD', cx, y + 48 + bob, { size: narrow ? 58 : 76, font: TITLE_FONT, weight: '400', color: '#f2c531', align: 'center', stroke: '#3a1f0a', strokeW: 8, spacing: 2 });
  y += 70;
  text('SEASONED TREE CARE PRESENTS', cx, y, { size: narrow ? 10 : 12, color: '#8ad46a', align: 'center', spacing: 3, weight: '800' });
  y += 30;
  text('Feed the chipper. Fill the truck. Don’t jam it.', cx, y, { size: narrow ? 14 : 17, color: '#fff', align: 'center', weight: '600' });
  y += 34;
  const lines = [
    ['▶', 'Fill a row to chip it. Four at once is a FULL FEED.'],
    ['▶', 'Oversize logs won’t fit. Hit SAW to cut any piece in half.'],
    ['▶', 'Rocks wreck the blade. Saw them loose, then hard-drop to toss.'],
    ['▶', 'Ten rows fills a truck: new level, blade repaired, faster feed.'],
  ];
  const ls = narrow ? 13 : 15;
  for (const [b, l] of lines) { text(b, p.x + 30, y, { size: ls - 2, color: '#e0702a', align: 'left' }); text(l, p.x + 50, y, { size: ls, color: 'rgba(255,255,255,0.85)', weight: '500' }); y += ls + 12; }
  y += 8;
  if (!IS_TOUCH) {
    text('← → move   ↑ / Z rotate   ↓ soft   SPACE drop   C hold   F saw   P pause   M mute', cx, y, { size: narrow ? 10 : 12, color: 'rgba(255,255,255,0.55)', align: 'center', weight: '600' });
  } else {
    text('Swipe to move · tap the hopper to rotate · flick down to drop · buttons below', cx, y, { size: narrow ? 10 : 12, color: 'rgba(255,255,255,0.55)', align: 'center', weight: '600' });
  }
  y += 40;
  const blink = 0.55 + 0.45 * Math.sin(G.time * 5);
  ctx.globalAlpha = blink;
  text(IS_TOUCH ? 'TAP TO START' : 'PRESS ENTER TO START', cx, y + 8, { size: narrow ? 22 : 26, font: TITLE_FONT, weight: '400', color: '#fff', align: 'center', stroke: '#000', strokeW: 4, spacing: 2 });
  ctx.globalAlpha = 1;
  if (G.hi > 0) text('BEST  ' + statNum(G.hi), cx, p.y + p.h - 30, { size: 13, color: '#ffd166', align: 'center', spacing: 2, weight: '800' });
}
function drawGameOver() {
  const t = clamp(G.overT / 0.5, 0, 1);
  const w = Math.min(W - 24, 520), h = Math.min(H - 24, 440);
  ctx.globalAlpha = t;
  const p = drawOverlayPanel(w, h), cx = W / 2;
  let y = p.y + 30;
  const jam = G.over === 'JAMMED';
  text(jam ? 'JAMMED!' : 'BLADE DESTROYED!', cx, y + 48, { size: w < 420 ? 40 : 54, font: TITLE_FONT, weight: '400', color: jam ? '#ffb36b' : '#ff4a3d', align: 'center', stroke: '#000', strokeW: 7, spacing: 2 });
  y += 70;
  text(jam ? 'The hopper backed up and the chipper choked.' : 'That rock ate the last blade. Ouch.', cx, y, { size: 14, color: 'rgba(255,255,255,0.8)', align: 'center', weight: '500' });
  y += 44;
  text(statNum(G.score), cx, y + 20, { size: 46, font: TITLE_FONT, weight: '400', color: '#fff', align: 'center' });
  y += 34;
  if (G.newHi) { ctx.globalAlpha = t * (0.6 + 0.4 * Math.sin(G.time * 6)); text('NEW HIGH SCORE!', cx, y + 14, { size: 18, font: TITLE_FONT, weight: '400', color: '#ffd166', align: 'center', spacing: 2 }); ctx.globalAlpha = t; }
  else text('BEST  ' + statNum(G.hi), cx, y + 12, { size: 13, color: '#ffd166', align: 'center', spacing: 2, weight: '800' });
  y += 46;
  const stats = [['TRUCKS HAULED', G.stats.trucks], ['ROWS CHIPPED', G.rows], ['FULL FEEDS', G.stats.fullFeeds], ['ROCKS TOSSED', G.stats.tossed], ['SAW CUTS', G.stats.cuts], ['PIECES FED', G.stats.pieces]];
  const colW = (w - 60) / 2;
  stats.forEach(([k, v], i) => { const col = i % 2, row = Math.floor(i / 2), x = p.x + 30 + col * colW, yy = y + row * 26; text(k, x, yy, { size: 11, color: 'rgba(255,255,255,0.55)', spacing: 1, weight: '800' }); text(String(v), x + colW - 16, yy, { size: 16, font: TITLE_FONT, weight: '400', color: '#fff', align: 'right' }); });
  y += 3 * 26 + 12;
  if (G.overT > 0.7) { ctx.globalAlpha = 0.55 + 0.45 * Math.sin(G.time * 5); text(IS_TOUCH ? 'TAP TO RUN IT BACK' : 'ENTER TO RUN IT BACK', cx, y + 16, { size: 22, font: TITLE_FONT, weight: '400', color: '#fff', align: 'center', stroke: '#000', strokeW: 4, spacing: 2 }); }
  ctx.globalAlpha = 1;
}
function drawPaused() {
  const p = drawOverlayPanel(Math.min(W - 24, 360), 170), cx = W / 2;
  text('PAUSED', cx, p.y + 78, { size: 48, font: TITLE_FONT, weight: '400', color: '#fff', align: 'center', stroke: '#000', strokeW: 6, spacing: 3 });
  text(IS_TOUCH ? 'tap to resume' : 'P or ESC to resume  ·  R to restart', cx, p.y + 120, { size: 13, color: 'rgba(255,255,255,0.7)', align: 'center', weight: '600' });
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  computeLayout();
  drawBackground();
  ctx.save(); ctx.translate(G.shakeX, G.shakeY);
  if (!L.portrait) { // truck behind chute
    ctx.save(); ctx.beginPath(); ctx.rect(L.rightX - 30, L.truckY - L.truckW * 0.6, W - L.rightX + 30, L.truckW * 0.6 + 30); ctx.clip(); ctx.restore();
  }
  drawChipper();
  drawBoard();
  ctx.restore();
  if (L.portrait) drawPortraitHUD(); else drawLandscapePanels();
  ctx.save(); ctx.translate(G.shakeX, G.shakeY); drawParticles(); ctx.restore();
  drawPopups();
  // strain vignette
  if (G.state === 'playing' && G.strain > 0.55) {
    const s = (G.strain - 0.55) / 0.45, pulse = 0.6 + 0.4 * Math.sin(G.time * 8);
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(255,40,20,0)'); vg.addColorStop(1, `rgba(255,40,20,${0.45 * s * pulse})`);
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }
  if (G.flash > 0) { ctx.globalAlpha = G.flash * 0.45; ctx.fillStyle = G.flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (G.state === 'title') drawTitle();
  else if (G.state === 'over') drawGameOver();
  else if (G.state === 'paused') drawPaused();
  drawButtons();
}

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1; if (dt < 0) dt = 0;
  update(dt); render();
  requestAnimationFrame(frame);
}
newBoard();
computeLayout();
requestAnimationFrame(frame);

// debug/test hooks (harmless)
window.ChipYard = { G, get board() { return board; }, startGame, pressAction, releaseAction, hardDrop, sawCut, holdPiece, tryRotate, tryMove, spawnNext, lockPiece, makePiece, L };
})();
</script>
