<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c1a14">
<title>Chip Yard</title>
<meta name="description" content="Run the chipper. Toss what doesn't fit, turn what's backwards, feed the rest. A fast reaction game from the tree care yard.">
<style>
  html,body{margin:0;padding:0;height:100%;background:#0c1a14;overflow:hidden;}
  body{position:fixed;inset:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;}
  canvas{display:block;touch-action:none;}
</style>
</head>
<body>
<canvas id="g" aria-label="Chip Yard game" role="img"></canvas>
<script>
(() => {
'use strict';

/* =========================================================================
   CHIP YARD  —  run the chipper
   Material slides down the feed table toward a 12-inch drum chipper.
   Too big? TOSS it. Tips first? TURN it. Rock or steel? TOSS it.
   Good wood rides in on its own, or FEED it fast for a bonus.
   Single-file, zero-dependency HTML5 canvas game.
   ========================================================================= */

// ---------- constants ----------
const TAU = Math.PI * 2;
const INCH = 4.5;                 // world units per inch
const MAX_DIA = 12;               // chipper capacity in inches
const WORLD_H = 560, GROUND = 472, TABLE_Y = 418;
const MAX_STRIKES = 3, FEEDS_PER_TRUCK = 12;
const TITLE_FONT = "Impact, 'Arial Black', 'Helvetica Neue', Arial, sans-serif";
const BODY_FONT = "'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif";
const IS_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

const canvas = document.getElementById('g');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(320, window.innerWidth); H = Math.max(320, window.innerHeight);
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
}
window.addEventListener('resize', resize);
resize();

// ---------- utils ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[rint(0, arr.length - 1)];
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;
function mulberry(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(a, b, t) {
  const A = hexToRgb(a), B = hexToRgb(b);
  return `rgb(${Math.round(lerp(A[0], B[0], t))},${Math.round(lerp(A[1], B[1], t))},${Math.round(lerp(A[2], B[2], t))})`;
}
function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function text(str, x, y, o = {}) {
  const size = o.size || 16, font = o.font || BODY_FONT, weight = o.weight || '700';
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.baseline || 'alphabetic';
  if (o.spacing) { try { ctx.letterSpacing = o.spacing + 'px'; } catch (e) { } }
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.strokeW || Math.max(2, size * 0.14); ctx.strokeStyle = o.stroke; ctx.strokeText(str, x, y); }
  ctx.fillStyle = o.color || '#fff';
  ctx.fillText(str, x, y);
  if (o.spacing) { try { ctx.letterSpacing = '0px'; } catch (e) { } }
}

// ---------- audio (synthesized) ----------
const Sound = (() => {
  let ac = null, master = null, noiseBuf = null, engine = null, muted = false;
  try { muted = localStorage.getItem('chipyard.muted') === '1'; } catch (e) { }
  function init() {
    if (ac) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try { ac = new AC(); } catch (e) { return; }
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.6; master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function resume() { if (ac && ac.state === 'suspended') ac.resume().catch(() => { }); }
  const now = () => ac ? ac.currentTime : 0;
  function tone(freq, dur, o = {}) {
    if (!ac) return;
    const t = now() + (o.delay || 0), osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(freq, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.slide), t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(o.vol || 0.3, t + (o.attack || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(master); osc.start(t); osc.stop(t + dur + 0.05);
  }
  function noise(dur, o = {}) {
    if (!ac) return;
    const t = now() + (o.delay || 0), s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = ac.createBiquadFilter(); f.type = o.type || 'bandpass'; f.frequency.setValueAtTime(o.freq || 1000, t);
    if (o.slide) f.frequency.exponentialRampToValueAtTime(o.slide, t + dur); f.Q.value = o.q || 1;
    const g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(o.vol || 0.3, t + (o.attack || 0.01));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.05);
  }
  function startEngine() {
    if (!ac || engine) return;
    const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 42;
    const o2 = ac.createOscillator(); o2.type = 'square'; o2.frequency.value = 84.5;
    const lf = ac.createBiquadFilter(); lf.type = 'lowpass'; lf.frequency.value = 220;
    const g = ac.createGain(); g.gain.value = 0;
    o.connect(lf); o2.connect(lf); lf.connect(g); g.connect(master); o.start(); o2.start();
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const nf = ac.createBiquadFilter(); nf.type = 'lowpass'; nf.frequency.value = 300;
    const ng = ac.createGain(); ng.gain.value = 0; s.connect(nf); nf.connect(ng); ng.connect(master); s.start();
    engine = { o, o2, lf, g, s, nf, ng };
    g.gain.linearRampToValueAtTime(0.07, now() + 1); ng.gain.linearRampToValueAtTime(0.05, now() + 1);
  }
  function setEngine(rev, stalled) {
    if (!engine) return; const t = now();
    const f = stalled ? 20 : 42 + rev * 30;
    engine.o.frequency.setTargetAtTime(f, t, 0.08); engine.o2.frequency.setTargetAtTime(f * 2.01, t, 0.08);
    engine.lf.frequency.setTargetAtTime(stalled ? 120 : 220 + rev * 500, t, 0.1);
    engine.g.gain.setTargetAtTime(stalled ? 0.03 : 0.07 + rev * 0.06, t, 0.1);
    engine.ng.gain.setTargetAtTime(stalled ? 0.01 : 0.05 + rev * 0.12, t, 0.1);
    engine.nf.frequency.setTargetAtTime(300 + rev * 1500, t, 0.1);
  }
  function stopEngine() {
    if (!engine) return; const t = now(), e = engine; engine = null;
    e.g.gain.setTargetAtTime(0, t, 0.4); e.ng.gain.setTargetAtTime(0, t, 0.4);
    e.o.frequency.setTargetAtTime(15, t, 0.5);
    setTimeout(() => { try { e.o.stop(); e.o2.stop(); e.s.stop(); } catch (err) { } }, 2000);
  }
  function toggleMute() {
    muted = !muted; if (master) master.gain.setTargetAtTime(muted ? 0 : 0.6, now(), 0.02);
    try { localStorage.setItem('chipyard.muted', muted ? '1' : '0'); } catch (e) { }
    return muted;
  }
  const sfx = {
    feed(dur) { noise(dur + 0.2, { vol: 0.35, freq: 900, q: 0.6, slide: 2200, attack: 0.05 }); tone(70, dur + 0.2, { type: 'sawtooth', vol: 0.15, slide: 120 }); },
    quick() { tone(660, 0.08, { type: 'square', vol: 0.08, slide: 990 }); tone(990, 0.1, { type: 'square', vol: 0.08, delay: 0.07, slide: 1320 }); },
    toss() { noise(0.25, { vol: 0.18, freq: 1200, q: 0.8, slide: 400 }); tone(300, 0.2, { type: 'triangle', vol: 0.12, slide: 700 }); },
    thud() { tone(90, 0.18, { type: 'sine', vol: 0.35, slide: 40 }); noise(0.1, { vol: 0.15, freq: 500, q: 0.7 }); },
    turn() { tone(420, 0.06, { type: 'triangle', vol: 0.12, slide: 640 }); noise(0.08, { vol: 0.08, freq: 3000, q: 1 }); },
    bad() { tone(220, 0.2, { type: 'square', vol: 0.1, slide: 160 }); },
    jam() { tone(160, 0.5, { type: 'sawtooth', vol: 0.3, slide: 30 }); noise(0.5, { vol: 0.3, freq: 300, q: 0.5, slide: 80 }); tone(55, 0.6, { type: 'square', vol: 0.2, slide: 20, delay: 0.1 }); },
    clang() { tone(2600, 0.3, { type: 'square', vol: 0.2, slide: 1800 }); tone(3900, 0.25, { type: 'square', vol: 0.12, slide: 2900 }); noise(0.35, { vol: 0.4, freq: 5000, q: 0.3 }); tone(60, 0.4, { type: 'sine', vol: 0.4, slide: 30 }); },
    snag() { noise(0.4, { vol: 0.3, freq: 700, q: 0.4, slide: 150 }); tone(120, 0.4, { type: 'sawtooth', vol: 0.2, slide: 40 }); },
    levelup() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, { type: 'square', vol: 0.12, delay: i * 0.09 })); },
    honk() { tone(330, 0.18, { type: 'sawtooth', vol: 0.12 }); tone(415, 0.18, { type: 'sawtooth', vol: 0.12 }); tone(330, 0.25, { type: 'sawtooth', vol: 0.12, delay: 0.22 }); tone(415, 0.25, { type: 'sawtooth', vol: 0.12, delay: 0.22 }); },
    start() { [392, 523, 659].forEach((f, i) => tone(f, 0.2, { type: 'triangle', vol: 0.15, delay: i * 0.08 })); },
    gameover() { [400, 320, 240, 150].forEach((f, i) => tone(f, 0.35, { type: 'sawtooth', vol: 0.15, delay: i * 0.18, slide: f * 0.8 })); noise(1.2, { vol: 0.25, freq: 400, q: 0.5, slide: 60 }); },
    pause() { tone(300, 0.1, { type: 'square', vol: 0.08 }); },
    combo(n) { tone(440 + n * 60, 0.08, { type: 'square', vol: 0.06, slide: 660 + n * 60 }); },
  };
  return { init, resume, startEngine, setEngine, stopEngine, toggleMute, get muted() { return muted; }, sfx };
})();

// ---------- game state ----------
let idSeq = 1;
const G = {
  state: 'title', items: [], score: 0, best: 0, level: 1, feeds: 0, feedsThisTruck: 0, strikes: 0, combo: 0, bestCombo: 0,
  speed: 110, stall: 0, feeding: null, rev: 0, drum: 0, drumSpd: 0, roller: 0, time: 0, overT: 0,
  shake: 0, shakeX: 0, shakeY: 0, flash: 0, flashColor: '#fff', popups: [], parts: [], smoke: [], chuteQueue: 0,
  truck: { off: 0, state: 'in', t: 0 }, pile: [], motes: [], stats: { fed: 0, tossed: 0, turned: 0, wasted: 0, quick: 0, trucks: 0 }, newBest: false,
};
try { G.best = parseInt(localStorage.getItem('chipyard2.best') || '0', 10) || 0; } catch (e) { }
for (let i = 0; i < 30; i++) G.motes.push({ x: Math.random(), y: Math.random(), s: rnd(0.4, 1.4), p: rnd(0, TAU), v: rnd(0.004, 0.012) });

// ---------- layout ----------
const L = { s: 1, ox: 0, oy: 0, WW: 1040, mouthX: 540, tableX0: 130, portrait: false, hasTruck: true, truckX: 880, btnH: 0, hudH: 0, touch: IS_TOUCH, nozzle: { x: 0, y: 0, a: 0 } };
let buttons = [];
function computeLayout() {
  L.portrait = W < H * 1.05 || W < 720;
  L.touch = IS_TOUCH;
  if (!L.portrait) {
    L.WW = 1110; L.mouthX = 540; L.tableX0 = 120; L.hasTruck = true; L.truckX = L.mouthX + 340;
    L.hudH = 0; L.btnH = L.touch ? Math.min(90, H * 0.14) : 0;
    L.s = Math.min(W / L.WW, (H - L.btnH) / WORLD_H);
    L.ox = (W - L.WW * L.s) / 2; L.oy = Math.max((H - L.btnH - WORLD_H * L.s) / 2, H - L.btnH - GROUND * L.s - 64);
  } else {
    L.WW = 640; L.mouthX = 380; L.tableX0 = 30; L.hasTruck = false; L.truckX = 0;
    L.hudH = 96; L.btnH = L.touch ? Math.min(150, H * 0.2) : 0;
    L.s = Math.min(W / 580, (H - L.hudH - L.btnH) / WORLD_H);
    L.ox = 0; L.oy = Math.max(L.hudH - 60, H - L.btnH - GROUND * L.s - 44);
  }
  L.nozzle = L.hasTruck ? { x: L.mouthX + 318, y: 176, a: 0.85 } : { x: L.mouthX + 205, y: 140, a: -0.12 };
  buttons = [];
  if (L.touch) {
    const gap = 8, n = 3, tw = Math.min(W, 640), bw = (tw - gap * (n + 1)) / n, bh = L.btnH - gap * 2, x0 = (W - tw) / 2 + gap, y0 = H - L.btnH + gap;
    [['toss', 'TOSS', '◀ swipe off'], ['turn', 'TURN', 'tap to flip'], ['feed', 'FEED', 'swipe in ▶']].forEach(([id, label, sub], i) => buttons.push({ id, label, sub, x: x0 + i * (bw + gap), y: y0, w: bw, h: bh, down: false }));
  }
  const ib = Math.round(clamp(W * 0.05, 34, 44));
  buttons.push({ id: 'mute', icon: 'mute', x: W - ib - 10, y: 10, w: ib, h: ib, down: false });
  if (L.touch || L.portrait) buttons.push({ id: 'pause', icon: 'pause', x: W - ib * 2 - 18, y: 10, w: ib, h: ib, down: false });
}
const wx = x => L.ox + x * L.s, wy = y => L.oy + y * L.s;   // world -> screen

// ---------- items ----------
function levelSpeed(lv) { return Math.min(260, 105 + (lv - 1) * 16); }
function makeItem() {
  const lv = G.level, id = idSeq++, seed = (id * 7919) & 0xffff;
  const r = Math.random();
  let it;
  const rockP = lv >= 2 ? 0.1 : 0, metalP = lv >= 3 ? 0.08 : 0, brushP = 0.36;
  if (r < rockP) it = { kind: 'rock', w: rnd(52, 76), h: rnd(38, 54) };
  else if (r < rockP + metalP) it = { kind: 'metal', w: rnd(150, 200), h: 16 };
  else if (r < rockP + metalP + brushP) it = { kind: 'brush', w: rnd(150, 215), h: 62, facing: Math.random() < 0.5 ? 'right' : 'wrong', butt: rnd(3, 5) };
  else {
    const big = Math.random() < 0.42;
    const dia = big ? (lv >= 4 && Math.random() < 0.5 ? rint(13, 15) : rint(13, 22)) : (lv >= 4 && Math.random() < 0.5 ? rint(9, 12) : rint(4, 12));
    it = { kind: 'log', dia, w: rnd(80, 150) + dia * 2, h: dia * INCH, tagged: lv < 3 };
  }
  it.id = id; it.seed = seed; it.state = 'table'; it.t = 0; it.x = L.tableX0 - it.w - 10; it.vx = 0; it.flipT = -1; it.quick = false;
  it.ok = it.kind === 'log' ? it.dia <= MAX_DIA : it.kind === 'brush' ? it.facing === 'right' : false;
  return it;
}
function describeProblem(it) {
  if (it.kind === 'log' && it.dia > MAX_DIA) return `${it.dia}" LOG. MAX IS ${MAX_DIA}".`;
  if (it.kind === 'brush' && it.facing === 'wrong') return 'TIPS FIRST. IT SNAGGED.';
  if (it.kind === 'rock') return 'ROCK IN THE DRUM.';
  if (it.kind === 'metal') return 'STEEL IN THE DRUM.';
  return '';
}
function activeItem() {
  let best = null;
  for (const it of G.items) if (it.state === 'table' && (!best || it.x > best.x)) best = it;
  return best;
}
function itemAt(sx) { // nearest table item to a screen x
  let best = null, bd = Infinity;
  for (const it of G.items) if (it.state === 'table') { const cx = wx(it.x + it.w / 2), d = Math.abs(cx - sx); if (d < bd) { bd = d; best = it; } }
  return bd < 140 * L.s + 40 ? best : activeItem();
}

// ---------- scoring helpers ----------
function mult() { return Math.min(5, 1 + Math.floor(G.combo / 5)); }
function addCombo() { G.combo++; if (G.combo > G.bestCombo) G.bestCombo = G.combo; if (G.combo % 5 === 0) { addPopup('COMBO x' + mult(), { color: '#9be7ff', size: 0.9, y: 120 }); Sound.sfx.combo(G.combo / 5); } }
function breakCombo() { if (G.combo >= 5) addPopup('COMBO LOST', { color: '#ff8c69', size: 0.8, y: 120 }); G.combo = 0; }
function award(pts, label, color, itx) {
  const p = pts * mult(); G.score += p;
  addPopup(label + (p ? '  +' + p : ''), { color: color || '#e9f5e1', size: 0.95, x: itx != null ? wx(itx) : undefined, y: 300 });
}

// ---------- actions ----------
function actToss(it) {
  if (!it || it.state !== 'table') return;
  it.state = 'toss'; it.t = 0; it.x0 = it.x; Sound.sfx.toss(); G.stats.tossed++;
  const cx = it.x + it.w / 2;
  if (it.kind === 'log' && it.dia > MAX_DIA) { award(150, 'TOO BIG. TOSSED', '#ffd166', cx); addCombo(); }
  else if (it.kind === 'rock') { award(200, 'ROCK OUT', '#ffd166', cx); addCombo(); }
  else if (it.kind === 'metal') { award(200, 'STEEL OUT', '#ffd166', cx); addCombo(); }
  else if (it.kind === 'brush' && it.facing === 'wrong') { G.score = Math.max(0, G.score - 50); addPopup('JUST TURN IT.  -50', { color: '#ff8c69', size: 0.9, x: wx(cx), y: 300 }); breakCombo(); G.stats.wasted++; Sound.sfx.bad(); }
  else { G.score = Math.max(0, G.score - 100); addPopup('GOOD WOOD WASTED.  -100', { color: '#ff8c69', size: 0.9, x: wx(cx), y: 300 }); breakCombo(); G.stats.wasted++; Sound.sfx.bad(); }
}
function actTurn(it) {
  if (!it || it.state !== 'table' || it.flipT >= 0) return;
  it.flipT = 0; Sound.sfx.turn(); G.stats.turned++;
  if (it.kind === 'brush') {
    it.facing = it.facing === 'right' ? 'wrong' : 'right'; it.ok = it.facing === 'right';
    if (it.ok) { award(50, 'TURNED. BUTT FIRST', '#b8f2a0', it.x + it.w / 2); addCombo(); }
    else { addPopup("NOW IT'S BACKWARDS", { color: '#ff8c69', size: 0.85, x: wx(it.x + it.w / 2), y: 300 }); }
  }
}
function actFeed(it) {
  if (!it || it.state !== 'table') return;
  it.vx = 560; it.quick = true;      // shoving a bad piece in is on you
  if (it.ok) Sound.sfx.quick();
}
function beginFeed(it) {
  it.state = 'feed'; it.t = 0; it.vx = 210; G.feeding = it;
  const dur = it.w / it.vx;
  Sound.sfx.feed(dur); G.rev = 1; G.chuteQueue += Math.round(it.w * 0.35);
  G.feeds++; G.feedsThisTruck++; G.stats.fed++;
  if (it.quick) { G.stats.quick++; award(150, 'QUICK FEED', '#9be7ff', it.x + it.w / 2); } else award(100, it.kind === 'brush' ? 'BRUSH IN' : 'LOG IN', '#e9f5e1', it.x + it.w / 2);
  addCombo();
  if (G.feedsThisTruck >= FEEDS_PER_TRUCK) truckFull();
}
function strike(it, reason) {
  G.strikes++; G.stall = 1.4; breakCombo();
  it.state = 'jam'; it.t = 0; it.ax = null; G.shake = 12; G.flash = 1; G.flashColor = '#ff3b2f';
  if (it.kind === 'rock' || it.kind === 'metal') Sound.sfx.clang(); else if (it.kind === 'brush') Sound.sfx.snag(); else Sound.sfx.jam();
  addPopup(reason, { color: '#ff6b57', size: 1.05, y: 250 });
  addPopup('STRIKE ' + G.strikes + ' OF ' + MAX_STRIKES, { color: '#ff6b57', size: 0.8, y: 290 });
  sparks(wx(L.mouthX + 30), wy(TABLE_Y - 30), it.kind === 'rock' || it.kind === 'metal' ? 50 : 18);
  if (G.strikes >= MAX_STRIKES) setTimeout(() => { if (G.state === 'playing') gameOver(); }, 900);
}
function truckFull() {
  G.stats.trucks++; G.level++; G.feedsThisTruck = 0; G.speed = levelSpeed(G.level);
  if (G.strikes > 0) { G.strikes--; addPopup('WARNING LIGHT CLEARED', { color: '#b8f2a0', size: 0.8, y: 160 }); }
  addPopup('TRUCK FULL.  LEVEL ' + G.level, { color: '#ffd166', size: 1.2, y: 100, life: 1.8 });
  if (G.level === 3) addPopup('NO MORE SIZE TAGS. EYEBALL IT.', { color: '#ffd166', size: 0.8, y: 140, life: 2.2 });
  if (G.level === 2) addPopup('WATCH FOR ROCKS', { color: '#ffd166', size: 0.8, y: 140, life: 2 });
  G.score += 500 * G.level; G.truck.state = 'leaving'; G.truck.t = 0;
  Sound.sfx.levelup(); setTimeout(() => { if (G.state === 'playing') Sound.sfx.honk(); }, 400);
  G.flash = 0.5; G.flashColor = '#ffd166';
}
function resetGame() {
  G.items = []; G.score = 0; G.level = 1; G.feeds = 0; G.feedsThisTruck = 0; G.strikes = 0; G.combo = 0; G.bestCombo = 0;

// ---------- update ----------
function update(dt) {
  G.time += dt;

  G.rev = lerp(G.rev, G.feeding ? 1 : 0, dt * 4);

  G.drumSpd = lerp(G.drumSpd, drumTarget, dt * 3); G.drum += dt * G.drumSpd; G.roller += dt * (running ? 3 + G.rev * 4 : 0);

  if (G.stall > 0) { G.stall -= dt; if (G.stall <= 0) G.stall = 0; }

  let frontEdge = Infinity;
  for (const it of items) {
    it.t += dt;
    if (it.flipT >= 0) { it.flipT += dt; if (it.flipT > 0.28) it.flipT = -1; }

        if (it.x + it.w >= L.mouthX) { if (it.ok) beginFeed(it); else strike(it, describeProblem(it)); }
      }
      frontEdge = Math.min(frontEdge, it.x);
    } else if (it.state === 'feed') {
      it.x += it.vx * dt;
      if (Math.random() < dt * 30) chipsAt(wx(L.mouthX) - 4 * L.s, wy(TABLE_Y - it.h / 2), 2, it.kind === 'brush' ? ['#5cb04a', '#8ad46a', '#8b5a2b'] : ['#e8c48a', '#c9954f', '#a86d34']);

    } else if (it.state === 'toss') {
      const T = 0.7, u = Math.min(1, it.t / T);

}

    text(statNum(G.score), rx, 32, { size: 30, font: TITLE_FONT, weight: '400', color: '#fff', align: 'right' });
    if (G.combo >= 5) text('COMBO x' + mult(), rx, 48, { size: 12, font: TITLE_FONT, weight: '400', color: '#9be7ff', align: 'right', spacing: 1 });
    text('TRUCK ' + G.level, pad, 72, { size: 16, font: TITLE_FONT, weight: '400', color: '#ffd166', spacing: 1 });
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; roundRect(pad + 80, 62, W * 0.35, 10, 5); ctx.fill();
    ctx.fillStyle = '#c99a5c'; roundRect(pad + 80, 62, W * 0.35 * (G.feedsThisTruck / FEEDS_PER_TRUCK), 10, 5); ctx.fill();
    text(G.feedsThisTruck + '/' + FEEDS_PER_TRUCK, pad + 80 + W * 0.35 + 8, 71, { size: 10, color: 'rgba(255,255,255,0.7)', weight: '800' });
    for (let i = 0; i < MAX_STRIKES; i++) warnLight(W - pad - 70 + i * 22, 70, 7, i < G.strikes);
    text('STRIKES', W - pad - 82, 88, { size: 8, color: 'rgba(255,255,255,0.6)', spacing: 1, weight: '800' });
    text('BEST ' + statNum(G.best), pad, 88, { size: 9, color: '#ffd166', spacing: 1, weight: '800' });
  }
}
function drawParticles() {
  screenTransform(); ctx.translate(G.shakeX, G.shakeY);
  for (const p of G.parts) {
    ctx.globalAlpha = clamp(p.life / 0.3, 0, 1); ctx.fillStyle = p.color;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
  }
  ctx.globalAlpha = 1;
}
function drawPopups() {
  screenTransform();
  for (const p of G.popups) {
    const t = p.t / p.life, pop = 1 + 0.6 * Math.max(0, 1 - p.t / 0.12);
    const y = p.y - easeOut(t) * 50 * L.s, a = t > 0.7 ? 1 - (t - 0.7) / 0.3 : 1;
    ctx.globalAlpha = a;
    text(p.text, p.x, y, { size: Math.max(14, 30 * L.s * p.size * pop), font: TITLE_FONT, weight: '400', color: p.color, align: 'center', stroke: 'rgba(0,0,0,0.85)', strokeW: 5, spacing: 1 });
  }
  ctx.globalAlpha = 1;
}
function drawButtons() {
  screenTransform();
  for (const b of buttons) {
    if (b.icon) {
      ctx.fillStyle = b.down ? 'rgba(255,255,255,0.35)' : 'rgba(0,0,0,0.4)'; roundRect(b.x, b.y, b.w, b.h, 8); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1; roundRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1, 8); ctx.stroke();
      const cx = b.x + b.w / 2, cy = b.y + b.h / 2, s = b.w * 0.26;
      ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      if (b.icon === 'pause') { if (G.state === 'paused') { ctx.beginPath(); ctx.moveTo(cx - s * 0.6, cy - s); ctx.lineTo(cx + s, cy); ctx.lineTo(cx - s * 0.6, cy + s); ctx.closePath(); ctx.fill(); } else { ctx.fillRect(cx - s * 0.8, cy - s, s * 0.55, s * 2); ctx.fillRect(cx + s * 0.25, cy - s, s * 0.55, s * 2); } }
      else {
        ctx.beginPath(); ctx.moveTo(cx - s, cy - s * 0.5); ctx.lineTo(cx - s * 0.4, cy - s * 0.5); ctx.lineTo(cx + s * 0.2, cy - s * 1.1); ctx.lineTo(cx + s * 0.2, cy + s * 1.1); ctx.lineTo(cx - s * 0.4, cy + s * 0.5); ctx.lineTo(cx - s, cy + s * 0.5); ctx.closePath(); ctx.fill();
        if (Sound.muted) { ctx.strokeStyle = '#ff6b57'; ctx.beginPath(); ctx.moveTo(cx + s * 0.45, cy - s * 0.6); ctx.lineTo(cx + s * 1.2, cy + s * 0.6); ctx.moveTo(cx + s * 1.2, cy - s * 0.6); ctx.lineTo(cx + s * 0.45, cy + s * 0.6); ctx.stroke(); }
        else { ctx.beginPath(); ctx.arc(cx + s * 0.3, cy, s * 0.8, -0.9, 0.9); ctx.stroke(); }
      }
      continue;
    }
    const accent = b.id === 'feed' ? '#8ad46a' : b.id === 'toss' ? '#ff8c69' : '#9be7ff';
    ctx.fillStyle = b.down ? 'rgba(255,255,255,0.32)' : 'rgba(0,0,0,0.5)'; roundRect(b.x, b.y, b.w, b.h, 14); ctx.fill();
    ctx.strokeStyle = b.down ? '#fff' : accent; ctx.lineWidth = 2; roundRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2, 14); ctx.stroke();
    text(b.label, b.x + b.w / 2, b.y + b.h / 2 + 4, { size: Math.min(30, b.h * 0.4), font: TITLE_FONT, weight: '400', color: accent, align: 'center', spacing: 2 });
    text(b.sub, b.x + b.w / 2, b.y + b.h / 2 + 22, { size: Math.min(12, b.h * 0.16), color: 'rgba(255,255,255,0.6)', align: 'center', weight: '700' });
  }
}
function drawOverlayPanel(w, h) {
  screenTransform();
  const x = W / 2 - w / 2, y = H / 2 - h / 2;
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(10,18,14,0.94)'; roundRect(x, y, w, h, 16); ctx.fill();
  ctx.strokeStyle = '#e0702a'; ctx.lineWidth = 3; roundRect(x + 1.5, y + 1.5, w - 3, h - 3, 16); ctx.stroke();
  hazardStripes(x + 16, y + 10, w - 32, 6); hazardStripes(x + 16, y + h - 16, w - 32, 6);
  return { x, y, w, h };
}
function drawTitle() {
  const w = Math.min(W - 24, 600), narrow = w < 440, h = Math.min(H - 24, narrow ? 384 : 372);
  const p = drawOverlayPanel(w, h), cx = W / 2;
  let y = p.y + 34;
  text('CHIP YARD', cx, y + 46 + Math.sin(G.time * 2) * 3, { size: narrow ? 56 : 72, font: TITLE_FONT, weight: '400', color: '#f2c531', align: 'center', stroke: '#3a1f0a', strokeW: 8, spacing: 2 });
  y += 66;
  text('SEASONED TREE CARE PRESENTS', cx, y, { size: narrow ? 10 : 12, color: '#8ad46a', align: 'center', spacing: 3, weight: '800' });
  y += 30;
  text(narrow ? 'Make the call before it hits the rollers.' : 'Run the chipper. Make the call before it hits the rollers.', cx, y, { size: narrow ? 13 : 16, color: '#fff', align: 'center', weight: '600' });
  y += 30;
  const ls = narrow ? 12 : 15, rows = narrow ? [
    ['TOSS', '#ff8c69', `Over ${MAX_DIA}", rocks, steel: swipe off.`],
    ['TURN', '#9be7ff', 'Brush goes in butt-first. Flip it.'],
    ['FEED', '#8ad46a', 'Good wood: shove it in for a bonus.'],
    ['', '#ffd166', `${FEEDS_PER_TRUCK} loads per truck. 3 strikes, you're done.`],
  ] : [
    ['TOSS', '#ff8c69', `Logs over ${MAX_DIA}" don't fit. Rocks and steel wreck the blades. Swipe them off.`],
    ['TURN', '#9be7ff', 'Brush goes in butt-first. If the leafy tips face the chipper, flip it.'],
    ['FEED', '#8ad46a', 'Good wood rides in on its own. Shove it in early for a Quick Feed bonus.'],
    ['', '#ffd166', `${FEEDS_PER_TRUCK} loads fill the truck. Three strikes and the yard shuts down.`],
  ];
  for (const [k, c, l] of rows) {
    if (k) { ctx.fillStyle = c; roundRect(p.x + 26, y - ls + 1, 54, ls + 6, 4); ctx.fill(); text(k, p.x + 53, y + 1, { size: ls - 2, font: TITLE_FONT, weight: '400', color: '#0c1a14', align: 'center', spacing: 1 }); }
    text(l, p.x + 92, y, { size: ls, color: 'rgba(255,255,255,0.88)', weight: '500' }); y += ls + 14;
  }
  y += 6;
  text(IS_TOUCH ? (narrow ? 'swipe left = toss · tap = turn · swipe right = feed' : 'Swipe left = toss   ·   tap = turn   ·   swipe right = feed   ·   or use the buttons') : '←  or  A  toss          ↓  or  S  turn          →  or  SPACE  feed          P pause    M mute', cx, y, { size: narrow ? 10 : 12, color: 'rgba(255,255,255,0.55)', align: 'center', weight: '600' });
  y += 36;
  ctx.globalAlpha = 0.55 + 0.45 * Math.sin(G.time * 5);
  text(IS_TOUCH ? 'TAP TO START' : 'PRESS ENTER TO START', cx, y + 6, { size: narrow ? 22 : 26, font: TITLE_FONT, weight: '400', color: '#fff', align: 'center', stroke: '#000', strokeW: 4, spacing: 2 });
  ctx.globalAlpha = 1;
  if (G.best > 0) text('BEST  ' + statNum(G.best), cx, p.y + p.h - 28, { size: 12, color: '#ffd166', align: 'center', spacing: 2, weight: '800' });
}
function drawGameOver() {
  const t = clamp(G.overT / 0.5, 0, 1), w = Math.min(W - 24, 520), h = Math.min(H - 24, 430);
  ctx.globalAlpha = t;
  const p = drawOverlayPanel(w, h), cx = W / 2; ctx.globalAlpha = t;
  let y = p.y + 30;
  text('YARD SHUT DOWN', cx, y + 44, { size: w < 420 ? 34 : 48, font: TITLE_FONT, weight: '400', color: '#ff4a3d', align: 'center', stroke: '#000', strokeW: 7, spacing: 2 });
  y += 64;
  text('Three strikes. The foreman pulled the key.', cx, y, { size: 14, color: 'rgba(255,255,255,0.8)', align: 'center', weight: '500' });
  y += 44;
  text(statNum(G.score), cx, y + 20, { size: 46, font: TITLE_FONT, weight: '400', color: '#fff', align: 'center' });
  y += 34;
  if (G.newBest) { ctx.globalAlpha = t * (0.6 + 0.4 * Math.sin(G.time * 6)); text('NEW BEST!', cx, y + 14, { size: 18, font: TITLE_FONT, weight: '400', color: '#ffd166', align: 'center', spacing: 2 }); ctx.globalAlpha = t; }
  else text('BEST  ' + statNum(G.best), cx, y + 12, { size: 13, color: '#ffd166', align: 'center', spacing: 2, weight: '800' });
  y += 46;
  const stats = [['TRUCKS FILLED', G.stats.trucks], ['PIECES FED', G.stats.fed], ['QUICK FEEDS', G.stats.quick], ['TOSSED OUT', G.stats.tossed], ['BEST COMBO', G.bestCombo], ['GOOD WOOD WASTED', G.stats.wasted]];
  const colW = (w - 60) / 2;
  stats.forEach(([k, v], i) => { const col = i % 2, row = Math.floor(i / 2), x = p.x + 30 + col * colW, yy = y + row * 26; text(k, x, yy, { size: 11, color: 'rgba(255,255,255,0.55)', spacing: 1, weight: '800' }); text(String(v), x + colW - 16, yy, { size: 16, font: TITLE_FONT, weight: '400', color: '#fff', align: 'right' }); });
  y += 3 * 26 + 12;
  if (G.overT > 0.7) { ctx.globalAlpha = 0.55 + 0.45 * Math.sin(G.time * 5); text(IS_TOUCH ? 'TAP TO RUN IT BACK' : 'ENTER TO RUN IT BACK', cx, y + 16, { size: 22, font: TITLE_FONT, weight: '400', color: '#fff', align: 'center', stroke: '#000', strokeW: 4, spacing: 2 }); }
  ctx.globalAlpha = 1;
}
function drawPaused() {
  const p = drawOverlayPanel(Math.min(W - 24, 360), 170), cx = W / 2;
  text('PAUSED', cx, p.y + 78, { size: 48, font: TITLE_FONT, weight: '400', color: '#fff', align: 'center', stroke: '#000', strokeW: 6, spacing: 3 });
  text(IS_TOUCH ? 'tap to resume' : 'P or ESC to resume  ·  N for a new game', cx, p.y + 120, { size: 13, color: 'rgba(255,255,255,0.7)', align: 'center', weight: '600' });
}

function render() {
  computeLayout();
  screenTransform();
  drawBackground();
  worldTransform();
  drawTruckW();
  drawChipperBackW();
  drawPileW();
  drawTableW();
  drawItemsW();
  drawChipperFrontW();
  drawBrushPileW();
  drawParticles();
  drawHUD();
  drawPopups();
  screenTransform();
  if (G.stall > 0) { ctx.globalAlpha = 0.2 + 0.12 * Math.sin(G.time * 20); ctx.fillStyle = '#ff3b2f'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (G.flash > 0) { ctx.globalAlpha = G.flash * 0.45; ctx.fillStyle = G.flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (G.state === 'title') drawTitle();
  else if (G.state === 'over') drawGameOver();
  else if (G.state === 'paused') drawPaused();
  drawButtons();

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1; if (dt < 0) dt = 0;
  update(dt); render();
  requestAnimationFrame(frame);
}
computeLayout();
requestAnimationFrame(frame);

window.ChipYard = { G, L, startGame, pressAction, makeItem, activeItem, actToss, actTurn, actFeed, strike, truckFull, gameOver };
})();
</script>
